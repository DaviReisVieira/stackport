[project]
name = "stackport"
version = "0.4.11"
description = "Web console and dashboard for local AWS emulators (AWS Emulator, MiniStack, Floci, LocalStack, Moto) and real AWS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Davi Reis Vieira"}]
keywords = [
    "aws",
    "aws-emulator",
    "ministack",
    "floci",
    "localstack",
    "moto",
    "emulator",
    "aws-console",
    "web-console",
    "dashboard",
    "ui",
    "resource-browser",
    "api-explorer",
    "boto3",
    "devtools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "boto3>=1.36.0",
    "click>=8.0",
    "websockets>=12.0",
    "python-multipart>=0.0.26",
]

[project.urls]
Homepage = "https://stackport.cloud"
Documentation = "https://stackport.cloud/docs/introduction/"
Repository = "https://github.com/DaviReisVieira/stackport"
Issues = "https://github.com/DaviReisVieira/stackport/issues"
Changelog = "https://github.com/DaviReisVieira/stackport/releases"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12.0", "httpx>=0.27.0", "moto[s3,sqs,lambda,dynamodb,iam,apigateway,apigatewayv2,cognitoidp,glue]>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["../ui/dist/**/*"]
"backend.learn" = ["trails/*.json"]

[project.scripts]
stackport = "backend.main:cli"
