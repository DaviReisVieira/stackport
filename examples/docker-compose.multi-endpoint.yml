# StackPort with multiple endpoints
#
# Usage:
#   docker compose -f docker-compose.multi-endpoint.yml up -d
#   Open http://localhost:8080
#
# This example runs two MiniStack instances as separate environments
# (e.g., "dev" and "staging") and connects StackPort to both.
# Use the endpoint selector in the sidebar to switch between them.

services:
  stackport:
    image: davireis/stackport:latest
    ports:
      - "8080:8080"
    environment:
      - STACKPORT_ENDPOINTS=dev=http://ministack-dev:4566,staging=http://ministack-staging:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      ministack-dev:
        condition: service_healthy
      ministack-staging:
        condition: service_healthy

  ministack-dev:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')" ]
      interval: 5s
      timeout: 3s
      retries: 5

  ministack-staging:
    image: ministackorg/ministack:latest
    ports:
      - "4567:4566"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')" ]
      interval: 5s
      timeout: 3s
      retries: 5
