# StackPort + AWS Emulator
#
# Usage:
#   curl -O https://raw.githubusercontent.com/DaviReisVieira/stackport/main/examples/docker-compose.aws-emulator.yml
#   docker compose -f docker-compose.aws-emulator.yml up -d
#   Open http://localhost:8080
#   docker compose -f docker-compose.aws-emulator.yml logs seed   # if the dashboard is empty
#
# AWS Emulator (https://github.com/aws/aws-emulator) serves the whole API
# surface on a single HTTPS port, 9297. There is no prebuilt image, so the
# first `up` builds one from the Dockerfile in AWS's "Getting started with
# Docker" guide, using the package for your CPU (x86_64, or Arm such as Apple
# silicon). To move to a newer release later, rebuild it and start again:
#   docker compose -f docker-compose.aws-emulator.yml build --no-cache aws-emulator
#   docker compose -f docker-compose.aws-emulator.yml up -d
#
# Two things work differently here than in the other examples, and this file
# is shaped around them:
#
# - Each start creates a new certificate that only covers 127.0.0.1 and
#   localhost. StackPort and the seed share the emulator's network
#   (`network_mode: service:aws-emulator`) so they can reach it on 127.0.0.1,
#   which is also why every published port sits on the emulator service.
# - Requests must be signed with keys the emulator creates on each start. It
#   writes them next to the certificate in ~/.aws/emulator/9297/, and the
#   `aws-emulator-files` volume shares that folder with the other containers.
#   StackPort finds both there by itself and switches to the new ones after a
#   restart, so it needs no AWS_ACCESS_KEY_ID or certificate settings.
#
# The emulator keeps everything in memory, so a restart starts from an empty
# account.
#
# Needs Docker Compose 2.17 or later with BuildKit (the default), for
# `dockerfile_inline`, `depends_on: restart` and the TARGETARCH build argument.
#
# The `seed` service runs once at startup and creates a handful of resources
# (S3, SQS, SNS, DynamoDB, Secrets Manager, IAM, Logs, Step Functions) so the
# dashboard has something to show on the first load. It is safe to re-run:
# once a run has completed it leaves a marker object behind and later runs
# exit without touching anything. The marker lives in the emulator too, so it
# goes away with everything else on a restart and the next run seeds again.
# Drop the seed once you are pointing StackPort at your own stack.

services:
  stackport:
    image: davireis/stackport:latest
    # Runs on the emulator's network, so its port 8080 is published there.
    network_mode: "service:aws-emulator"
    environment:
      - AWS_ENDPOINT_URL=https://127.0.0.1:9297
      - AWS_REGION=us-east-1
    volumes:
      # StackPort runs as root and looks in ~/.aws/emulator/<port>/ for the
      # emulator's keys and ca.pem.
      - aws-emulator-files:/root/.aws/emulator:ro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      aws-emulator:
        condition: service_healthy
        # Living on the emulator's network, StackPort has to restart with it.
        restart: true

  aws-emulator:
    build:
      # AWS's Dockerfile, with two changes: the package is picked for the CPU
      # Docker builds for, and the files folder is created up front so the
      # volume below starts out writable by the emulator's user (1000).
      dockerfile_inline: |
        FROM public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
        ARG TARGETARCH
        RUN case "$${TARGETARCH}" in \
              amd64) arch=x86_64 ;; \
              arm64) arch=aarch64 ;; \
              *) echo "AWS Emulator packages are built for amd64 and arm64, not '$${TARGETARCH}'" >&2; exit 1 ;; \
            esac \
            && curl -fsSLo /tmp/aws-emulator.rpm \
              "https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator-$${arch}.rpm" \
            && rpm -i /tmp/aws-emulator.rpm && rm /tmp/aws-emulator.rpm \
            && mkdir -p /home/emulator/.aws/emulator && chown -R 1000 /home/emulator
        USER 1000
        ENV HOME=/home/emulator
        EXPOSE 9297
        ENTRYPOINT ["aws-emulator", "-b", "0.0.0.0"]
    # Telemetry is on by default. To turn it off, uncomment the line below
    # (the arguments are added after the image's `aws-emulator -b 0.0.0.0`).
    # command: [ "--telemetry", "off" ]
    ports:
      # StackPort's console. It signs requests with the emulator's keys, so it
      # stays on this machine just like the emulator.
      - "127.0.0.1:8080:8080"
      # The emulator itself, published on 127.0.0.1 only, as AWS's guide does.
      # Its keys and certificate live in the volume; to use them from this
      # machine, copy them out (again after each restart):
      #   docker compose -f docker-compose.aws-emulator.yml cp aws-emulator:/home/emulator/.aws/emulator/9297 ./aws-emulator-9297
      - "127.0.0.1:9297:9297"
    volumes:
      # The keys, ca.pem and config the emulator writes for port 9297, plus its
      # telemetry ID, which lasts across runs here as it would in your home folder.
      - aws-emulator-files:/home/emulator/.aws/emulator
    # The limit AWS's guide uses: 2 GiB and no swap. Past it the container
    # stops with exit code 137 and the emulated resources are gone. To bring
    # everything back after that, run
    #   docker compose -f docker-compose.aws-emulator.yml up -d --force-recreate
    # (`up -d` alone starts the emulator again but leaves StackPort on the old network).
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      # curl ships with the amazonlinux:2023-minimal base image.
      test: [ "CMD", "curl", "-sf", "--cacert", "/home/emulator/.aws/emulator/9297/ca.pem", "https://127.0.0.1:9297/__admin/health" ]
      interval: 5s
      timeout: 3s
      retries: 5

  seed:
    image: amazon/aws-cli:latest
    network_mode: "service:aws-emulator"
    entrypoint: [ "/bin/sh", "-c" ]
    environment:
      # Settings from AWS's "Pointing your AWS SDK at AWS Emulator" guide, with
      # the paths where this container sees the shared volume. AWS_CONFIG_FILE
      # is left out: the config the emulator writes points at its own paths.
      - AWS_ENDPOINT_URL=https://127.0.0.1:9297
      - AWS_REGION=us-east-1
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/emulator/9297/emulator_credentials
      - AWS_CA_BUNDLE=/root/.aws/emulator/9297/ca.pem
      - AWS_DISABLE_HOST_PREFIX_INJECTION=true
      - AWS_EC2_METADATA_DISABLED=true
    volumes:
      - aws-emulator-files:/root/.aws/emulator:ro
    depends_on:
      aws-emulator:
        condition: service_healthy
        # Seeds the fresh, empty emulator again when Compose restarts it.
        restart: true
    command:
      - |
        set -eu

        # The marker object is written last, so a run that failed halfway is retried.
        if aws s3api head-object --bucket stackport-demo --key .seeded >/dev/null 2>&1; then
          echo "already seeded, skipping"
          exit 0
        fi

        # Run a create call, treating "already exists" as success so a retry
        # can get past the steps an earlier partial run completed.
        create() {
          out="$$("$$@" 2>&1)" && { echo "$$out"; return 0; }
          case "$$out" in
            *lreadyExist*|*ResourceExists*|*ResourceInUse*|*already*exist*) echo "exists: $$2 $$3"; return 0 ;;
          esac
          echo "$$out" >&2
          return 1
        }

        create aws s3api create-bucket --bucket stackport-demo
        echo '{"hello":"aws-emulator"}' > /tmp/hello.json
        aws s3 cp /tmp/hello.json s3://stackport-demo/data/hello.json
        aws s3 cp /tmp/hello.json s3://stackport-demo/data/archive/hello.json

        QUEUE_URL="$$(aws sqs create-queue --queue-name orders --output text)"
        aws sqs create-queue --queue-name orders-dlq
        QUEUE_ARN="$$(aws sqs get-queue-attributes --queue-url "$$QUEUE_URL" \
          --attribute-names QueueArn --query Attributes.QueueArn --output text)"
        aws sqs send-message --queue-url "$$QUEUE_URL" \
          --message-body '{"orderId":"1001","total":42}'

        TOPIC_ARN="$$(aws sns create-topic --name order-events --output text)"
        aws sns subscribe \
          --topic-arn "$$TOPIC_ARN" \
          --protocol sqs \
          --notification-endpoint "$$QUEUE_ARN"

        create aws dynamodb create-table --table-name Orders \
          --attribute-definitions AttributeName=pk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST
        # A new table can still be CREATING, as on AWS: wait until it takes writes.
        aws dynamodb wait table-exists --table-name Orders
        aws dynamodb put-item --table-name Orders \
          --item '{"pk":{"S":"ORDER#1001"},"total":{"N":"42"}}'

        create aws secretsmanager create-secret --name demo/api-key --secret-string 's3cr3t'

        create aws logs create-log-group --log-group-name /stackport/demo
        create aws logs create-log-stream --log-group-name /stackport/demo --log-stream-name run-1

        create aws iam create-role --role-name StackPortDemoRole \
          --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"states.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
        ROLE_ARN="$$(aws iam get-role --role-name StackPortDemoRole --query Role.Arn --output text)"

        create aws stepfunctions create-state-machine --name order-flow \
          --role-arn "$$ROLE_ARN" \
          --definition '{"Comment":"Demo flow","StartAt":"Validate","States":{"Validate":{"Type":"Pass","Next":"Charge"},"Charge":{"Type":"Pass","Next":"Done"},"Done":{"Type":"Succeed"}}}'

        date -u +%Y-%m-%dT%H:%M:%SZ | aws s3 cp - s3://stackport-demo/.seeded
        echo "seed complete"

volumes:
  aws-emulator-files:
