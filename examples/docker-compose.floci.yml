# StackPort + Floci
#
# Usage:
#   curl -O https://raw.githubusercontent.com/DaviReisVieira/stackport/main/examples/docker-compose.floci.yml
#   docker compose -f docker-compose.floci.yml up -d
#   Open http://localhost:8080
#   docker compose -f docker-compose.floci.yml logs seed   # if the dashboard is empty
#
# Floci (https://github.com/floci-io/floci) is an AWS emulator that serves the
# whole API surface on a single port, 4566 — the same shape StackPort expects
# from any AWS-compatible endpoint, so no StackPort-specific setup is needed.
#
# The `seed` service runs once at startup and creates a handful of resources
# (S3, SQS, SNS, DynamoDB, Secrets Manager, IAM, Logs, Step Functions) so the
# dashboard has something to show on the first load. It is safe to re-run:
# once a run has completed it leaves a marker object behind and later runs
# exit without touching anything. Drop it once you are pointing StackPort at
# your own stack.

services:
  stackport:
    image: davireis/stackport:latest
    ports:
      - "8080:8080"
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      floci:
        condition: service_healthy

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      # Must match the Compose service name so URLs Floci hands back
      # (SQS QueueUrl, pre-signed URLs, SNS callbacks) resolve from other containers.
      FLOCI_HOSTNAME: floci
      # memory | persistent | hybrid | wal — hybrid keeps state across restarts
      # in the `floci-data` volume below. Use `memory` for a throwaway stack.
      FLOCI_STORAGE_MODE: hybrid
    volumes:
      - floci-data:/app/data
      # Only needed for the Docker-backed services (Lambda, RDS, ElastiCache,
      # ECS, ...). Nothing the seed creates uses them, so the socket is off by
      # default: handing it to a container is host-root-equivalent access.
      # To opt in, uncomment the line below (the image's entrypoint fixes the
      # socket permissions itself, no `user:` override needed).
      # - /var/run/docker.sock:/var/run/docker.sock
    # No healthcheck block needed: the image ships its own HEALTHCHECK against
    # /_floci/health, which is what `service_healthy` below waits on.

  seed:
    image: amazon/aws-cli:latest
    entrypoint: [ "/bin/sh", "-c" ]
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      floci:
        condition: service_healthy
    command:
      - |
        set -eu

        # The marker object is written last, so a run that failed halfway is retried.
        if aws s3api head-object --bucket stackport-demo --key .seeded >/dev/null 2>&1; then
          echo "already seeded, skipping"
          exit 0
        fi

        # Run a create call, treating "already exists" as success so a retry
        # can get past the steps an earlier partial run completed.
        create() {
          out="$$("$$@" 2>&1)" && { echo "$$out"; return 0; }
          case "$$out" in
            *lreadyExist*|*ResourceExists*|*ResourceInUse*|*already*exist*) echo "exists: $$2 $$3"; return 0 ;;
          esac
          echo "$$out" >&2
          return 1
        }

        create aws s3api create-bucket --bucket stackport-demo
        echo '{"hello":"floci"}' > /tmp/hello.json
        aws s3 cp /tmp/hello.json s3://stackport-demo/data/hello.json
        aws s3 cp /tmp/hello.json s3://stackport-demo/data/archive/hello.json

        QUEUE_URL="$$(aws sqs create-queue --queue-name orders --output text)"
        aws sqs create-queue --queue-name orders-dlq
        QUEUE_ARN="$$(aws sqs get-queue-attributes --queue-url "$$QUEUE_URL" \
          --attribute-names QueueArn --query Attributes.QueueArn --output text)"
        aws sqs send-message --queue-url "$$QUEUE_URL" \
          --message-body '{"orderId":"1001","total":42}'

        TOPIC_ARN="$$(aws sns create-topic --name order-events --output text)"
        aws sns subscribe \
          --topic-arn "$$TOPIC_ARN" \
          --protocol sqs \
          --notification-endpoint "$$QUEUE_ARN"

        create aws dynamodb create-table --table-name Orders \
          --attribute-definitions AttributeName=pk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST
        aws dynamodb put-item --table-name Orders \
          --item '{"pk":{"S":"ORDER#1001"},"total":{"N":"42"}}'

        create aws secretsmanager create-secret --name demo/api-key --secret-string 's3cr3t'

        create aws logs create-log-group --log-group-name /stackport/demo
        create aws logs create-log-stream --log-group-name /stackport/demo --log-stream-name run-1

        create aws iam create-role --role-name StackPortDemoRole \
          --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"states.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
        ROLE_ARN="$$(aws iam get-role --role-name StackPortDemoRole --query Role.Arn --output text)"

        create aws stepfunctions create-state-machine --name order-flow \
          --role-arn "$$ROLE_ARN" \
          --definition '{"Comment":"Demo flow","StartAt":"Validate","States":{"Validate":{"Type":"Pass","Next":"Charge"},"Charge":{"Type":"Pass","Next":"Done"},"Done":{"Type":"Succeed"}}}'

        date -u +%Y-%m-%dT%H:%M:%SZ | aws s3 cp - s3://stackport-demo/.seeded
        echo "seed complete"

volumes:
  floci-data:
